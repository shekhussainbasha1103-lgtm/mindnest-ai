<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindNest AI — Ask • Upload • Learn • Grow</title>
<style>
:root{color-scheme:dark;--bg:#080d1c;--panel:#111a30;--line:#263452;--text:#f5f7ff;--muted:#aab6d3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17264a,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:24px 14px}
main{width:min(760px,100%);display:flex;flex-direction:column;gap:16px}header{text-align:center;padding:20px 8px}.logo{font-size:42px}h1{margin:6px 0;font-size:clamp(28px,6vw,42px)}.gradient{background:linear-gradient(90deg,#70d9ff,#a78bfa,#f0abfc);color:transparent;background-clip:text}.tag,.note{color:var(--muted)}
.chat{min-height:340px;max-height:55vh;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:18px;background:#0c1428cc;display:flex;flex-direction:column;gap:12px}
.bubble{padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:90%}.bot{background:var(--panel);align-self:flex-start;border:1px solid var(--line)}.user{background:#203b62;align-self:flex-end}
form{display:flex;gap:10px}textarea{flex:1;resize:vertical;min-height:54px;max-height:160px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);color:var(--text);font:inherit}
button{border:0;border-radius:14px;padding:0 20px;background:linear-gradient(135deg,#70d9ff,#a78bfa);color:#081020;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{text-align:center;font-size:13px}@media(max-width:500px){form{flex-direction:column}button{min-height:48px}}
</style></head><body><main>
<header><div class="logo">📘🤖</div><h1><span class="gradient">MindNest AI</span></h1><div class="tag">Ask • Upload • Learn • Grow</div><p class="tag">Your friendly AI study assistant</p></header>
<section id="chat" class="chat" aria-live="polite"><div class="bubble bot">Hi! I'm MindNest AI. Ask me a study question to get started.</div></section>
<form id="form"><textarea id="message" placeholder="Ask a study question..." aria-label="Your question" required></textarea><button id="send" type="submit">Ask Gemini</button></form>
<div class="note">Do not enter passwords or private information. AI answers can contain mistakes.</div>
</main><script>
const form=document.getElementById("form"),input=document.getElementById("message"),chat=document.getElementById("chat"),send=document.getElementById("send");
function bubble(text,who){const el=document.createElement("div");el.className="bubble "+who;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener("submit",async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;bubble(message,"user");input.value="";send.disabled=true;send.textContent="Thinking…";const waiting=bubble("Thinking…","bot");try{const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const data=await response.json();waiting.textContent=response.ok?(data.reply||"No response received."):(data.error||"Request failed.")}catch{waiting.textContent="Couldn't reach the server. Please try again."}finally{send.disabled=false;send.textContent="Ask Gemini";input.focus()}});
</script></body></html>
